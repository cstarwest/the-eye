<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#050505">
<title>GATEKEEPER</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%23050505'/%3E%3Ccircle cx='32' cy='32' r='18' fill='%23c01010'/%3E%3Cellipse cx='32' cy='32' rx='4' ry='12'/%3E%3C/svg%3E">
<style>
  :root {
    --red: #ff1a1a; --ember: #ff4a1a; --dim: #3a0000; --blood: #1a0000;
    --ink: #050505; --text: #c9c9c9; --mute: #6a6a6a;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; background: var(--ink); color: var(--text); font-family: var(--mono); overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none; }
  body.shake { animation: shake .28s linear; }
  @keyframes shake { 0%,100% { transform: none } 20% { transform: translate(-6px, 3px) } 40% { transform: translate(5px, -4px) } 60% { transform: translate(-4px, -2px) } 80% { transform: translate(3px, 4px) } }

  /* ---- the eye ---- */
  #eye { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  #vignette { position: fixed; inset: 0; pointer-events: none; background: radial-gradient(ellipse at center, transparent 35%, rgba(0,0,0,.55) 70%, #000 100%); }
  #scan { position: fixed; inset: 0; pointer-events: none; opacity: .22; background: repeating-linear-gradient(0deg, transparent 0 2px, rgba(0,0,0,.65) 2px 3px); }
  #glitch { position: fixed; inset: 0; z-index: 20; pointer-events: none; display: none; mix-blend-mode: screen; }
  #glitch.on { display: block; animation: gl .5s steps(7) forwards; background: repeating-linear-gradient(0deg, #f00 0 3px, #000 3px 9px, #fff 9px 10px); }
  @keyframes gl { 0% { opacity: .9; transform: translateY(0) } 50% { opacity: .6; transform: translateY(18px) skewX(-6deg) } 100% { opacity: 0; transform: translateY(-40px) skewX(8deg) } }

  /* ---- bottom console ---- */
  #ui { position: fixed; left: 0; right: 0; bottom: 0; z-index: 5; padding: 14px 16px calc(16px + env(safe-area-inset-bottom)); display: flex; flex-direction: column; gap: 10px; align-items: center; transition: opacity .4s; }
  #ui.hidden { opacity: 0; pointer-events: none; }
  #wave { width: min(440px, 84vw); height: 28px; display: block; }
  #line { min-height: 1.5em; max-width: min(640px, 92vw); font-size: 13px; letter-spacing: .14em; text-transform: uppercase; color: var(--red); text-align: center; opacity: .9; text-shadow: 0 0 10px var(--red), 0 0 2px #fff3; line-height: 1.5; }
  #line .cur { display: inline-block; width: .6em; height: 1em; vertical-align: -.15em; background: var(--red); animation: blink 1s steps(2) infinite; margin-left: 2px; }
  @keyframes blink { to { opacity: 0 } }
  #controls { display: flex; gap: 8px; width: min(560px, 92vw); }
  #q { flex: 1; min-width: 0; background: rgba(0,0,0,.6); border: 1px solid #2a0000; color: var(--text); padding: 12px 14px; font: inherit; font-size: 14px; outline: none; border-radius: 2px; transition: border-color .2s, box-shadow .2s; }
  #q::placeholder { color: #5a2a2a; letter-spacing: .08em; }
  #q:focus { border-color: var(--red); box-shadow: 0 0 14px var(--dim), inset 0 0 20px #0a0000; }
  button { background: transparent; border: 1px solid #3a0000; color: var(--red); padding: 0 16px; min-height: 44px; font: inherit; font-size: 12px; letter-spacing: .18em; cursor: pointer; border-radius: 2px; transition: all .15s; }
  button:hover, button:active { background: var(--dim); box-shadow: 0 0 14px var(--red); }
  button:disabled { opacity: .35; cursor: default; box-shadow: none; background: transparent; }
  button.live { background: var(--red); color: #000; animation: pulse .7s infinite alternate; }
  @keyframes pulse { to { box-shadow: 0 0 28px var(--red), 0 0 60px var(--dim) } }

  /* ---- answer readout ---- */
  #answer { position: fixed; left: 50%; bottom: calc(150px + env(safe-area-inset-bottom)); transform: translate(-50%, 12px); width: min(640px, 92vw); max-height: 42vh; overflow-y: auto; z-index: 6; padding: 16px 18px 18px; background: rgba(4,0,0,.82); border: 1px solid #3a0000; border-top-color: var(--red); box-shadow: 0 0 40px #000, inset 0 0 60px #0a0000; opacity: 0; pointer-events: none; transition: opacity .5s, transform .5s; font-size: 14px; line-height: 1.65; color: #e3dcdc; }
  #answer.on { opacity: 1; transform: translate(-50%, 0); pointer-events: auto; }
  #answer header { font-size: 10px; letter-spacing: .3em; color: var(--red); margin-bottom: 10px; display: flex; justify-content: space-between; opacity: .9; }
  #answer header span:last-child { color: var(--mute); }
  #answer .body { white-space: pre-wrap; word-break: break-word; }
  #answer .cur { display: inline-block; width: .55em; height: 1em; vertical-align: -.15em; background: var(--red); animation: blink 1s steps(2) infinite; margin-left: 2px; }
  #answer footer { margin-top: 12px; font-size: 10px; letter-spacing: .25em; color: var(--mute); text-align: right; }

  /* ---- arena (one-bit game) ---- */
  #stage { position: fixed; inset: 0; z-index: 10; display: none; background: rgba(0,0,0,.86); }
  #stage.on { display: block; }
  #stage.white { background: #fff; }
  #gc { position: absolute; left: 0; top: 0; image-rendering: pixelated; image-rendering: crisp-edges; background: #000; box-shadow: 0 0 0 1px #222, 0 0 80px #000; }
  #gtitle { position: absolute; left: 0; right: 0; text-align: center; color: #fff; font-size: 11px; letter-spacing: .36em; opacity: .75; pointer-events: none; }
  #ghelp { position: absolute; left: 0; right: 0; text-align: center; color: #666; font-size: 10px; letter-spacing: .22em; pointer-events: none; }
  #stage.danger #gc { animation: danger .5s ease-in-out infinite alternate; }
  #stage.danger #gtitle { color: var(--red); opacity: 1; text-shadow: 0 0 12px var(--red); }
  @keyframes danger { from { box-shadow: 0 0 0 1px #3a0000, 0 0 40px #000 } to { box-shadow: 0 0 0 2px var(--red), 0 0 120px #7a0000, 0 0 30px var(--red) } }

  /* ---- wake screen ---- */
  #wake { position: fixed; inset: 0; z-index: 30; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 28px; background: #000; color: var(--red); letter-spacing: .5em; font-size: 12px; cursor: pointer; transition: opacity 1.2s; }
  #wake.off { opacity: 0; pointer-events: none; }
  #wake .slit { width: min(60vw, 320px); height: 2px; background: var(--red); box-shadow: 0 0 24px var(--red), 0 0 80px var(--dim); animation: breathe 3.2s ease-in-out infinite; }
  @keyframes breathe { 0%,100% { transform: scaleX(.3); opacity: .35 } 50% { transform: scaleX(1); opacity: 1 } }
  #wake small { letter-spacing: .3em; font-size: 10px; color: #5a2a2a; }

  @media (max-height: 520px) { #answer { bottom: calc(128px + env(safe-area-inset-bottom)); max-height: 34vh; } }
  @media (prefers-reduced-motion: reduce) { body.shake { animation: none } #glitch.on { animation-duration: .25s } #stage.danger #gc { animation: none; box-shadow: 0 0 0 2px var(--red), 0 0 80px #5a0000 } }
</style>
</head>
<body>
<div id="wake"><div class="slit"></div><div>TAP TO WAKE</div><small>SOUND ON · HEADPHONES ADVISED</small></div>
<canvas id="eye"></canvas>
<div id="vignette"></div>
<div id="scan"></div>
<div id="glitch"></div>

<div id="answer" role="dialog" aria-live="polite">
  <header><span>SESSION READOUT</span><span id="astamp"></span></header>
  <div class="body" id="abody"></div>
  <footer>ESC · TAP TO DISMISS</footer>
</div>

<div id="ui">
  <canvas id="wave" width="440" height="28"></canvas>
  <div id="line" aria-live="polite"></div>
  <div id="controls">
    <input id="q" type="text" placeholder="speak to the gatekeeper" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Your question">
    <button id="mic" title="speak">MIC</button>
    <button id="ask">ASK</button>
  </div>
</div>

<div id="stage"><div id="gtitle"></div><canvas id="gc"></canvas><div id="ghelp"></div></div>

<script>
'use strict';
// =====================================================================
//  GATEKEEPER — a red eye that guards a Claude session.
//  Single file, no build step. Sections: CONFIG · AUDIO · VOICE · EYE ·
//  ARENA (one-bit games) · GATE (flow) · BACKEND · INPUT · WAKE
// =====================================================================

// ------------------------------ CONFIG -------------------------------
const CONFIG = {
  // Point this at a server exposing POST /ask { question } -> { answer }
  // (see server.mjs). Leave null to use the built-in mock oracle.
  // Can also be set per visit with ?api=http://localhost:3000
  api: new URLSearchParams(location.search).get('api') || null,
  key: new URLSearchParams(location.search).get('key') || null,   // sent as x-gatekeeper-key when set
  session: (crypto.randomUUID ? crypto.randomUUID() : Math.random().toString(36).slice(2)).slice(0, 8),
  oracle: null,                                                    // label reported by the bridge's /health
  voice: { pitch: 0.15, rate: 0.8 },      // as deep as the engine allows; the demon layer underneath does the rest
  reducedMotion: matchMedia('(prefers-reduced-motion: reduce)').matches,
};
const $ = id => document.getElementById(id);
const pick = a => a[Math.floor(Math.random() * a.length)];
const rnd = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const wait = ms => new Promise(r => setTimeout(r, ms));
const buzz = pattern => { try { navigator.vibrate && navigator.vibrate(pattern); } catch (e) {} };

// ------------------------------ AUDIO --------------------------------
// Everything is synthesized: no audio files. Buses: music (drone, beat),
// sfx (one-bit blips), voice (the mechanical layer under the TTS, which
// also feeds the analyser that drives the waveform bar).
const Audio_ = (() => {
  let AC, master, analyser, music, sfxBus, voiceBus, verbSend, noiseBuf;
  let drone = null, beat = null, intensity = 0, danger = false;
  const heart = { at: 0, per: 1400 };            // when the last thump landed (perf.now ms) and the period

  function init() {
    if (AC) return AC;
    AC = new (window.AudioContext || window.webkitAudioContext)();
    const comp = AC.createDynamicsCompressor(); comp.threshold.value = -16; comp.ratio.value = 5; comp.connect(AC.destination);
    master = AC.createGain(); master.gain.value = .9; master.connect(comp);
    analyser = AC.createAnalyser(); analyser.fftSize = 512; analyser.smoothingTimeConstant = .4;
    music = AC.createGain(); music.gain.value = .85; music.connect(master);
    sfxBus = AC.createGain(); sfxBus.gain.value = .7; sfxBus.connect(master);
    voiceBus = AC.createGain(); voiceBus.gain.value = 1; voiceBus.connect(master); voiceBus.connect(analyser);
    const reverb = AC.createConvolver(); reverb.buffer = impulse(3.4, 2.4);
    verbSend = AC.createGain(); verbSend.gain.value = .45; verbSend.connect(reverb); reverb.connect(master);
    noiseBuf = brown(2);
    return AC;
  }
  function impulse(sec, decay) {
    const len = AC.sampleRate * sec, b = AC.createBuffer(2, len, AC.sampleRate);
    for (let c = 0; c < 2; c++) { const d = b.getChannelData(c); for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, decay); }
    return b;
  }
  function brown(sec) {
    const len = AC.sampleRate * sec, b = AC.createBuffer(1, len, AC.sampleRate), d = b.getChannelData(0);
    for (let i = 0, l = 0; i < len; i++) { l = (l + .02 * (Math.random() * 2 - 1)) / 1.02; d[i] = l * 3.5; }
    return b;
  }

  // ---- drone: detuned saws/squares -> resonant lowpass swept by a slow LFO, a breathing noise bed,
  //      a heartbeat whose tempo follows `intensity`, and distant metallic hits in the reverb.
  function startDrone() {
    if (!AC || drone) return;
    const t = AC.currentTime;
    const g = AC.createGain(); g.gain.value = 0;
    const lp = AC.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 180; lp.Q.value = 5;
    const lfo = AC.createOscillator(); lfo.frequency.value = .06;
    const lfoG = AC.createGain(); lfoG.gain.value = 120; lfo.connect(lfoG); lfoG.connect(lp.frequency); lfo.start();
    const oscs = [36.7, 36.95, 55, 73.4, 110.3, 146.8].map((f, i) => {
      const o = AC.createOscillator(); o.type = i % 2 ? 'sawtooth' : 'square'; o.frequency.value = f; o.detune.value = (i - 2.5) * 6;
      const og = AC.createGain(); og.gain.value = .14 / (i + 1); o.connect(og); og.connect(lp); o.start(); return o;
    });
    const br = AC.createBufferSource(); br.buffer = noiseBuf; br.loop = true;
    const bf = AC.createBiquadFilter(); bf.type = 'bandpass'; bf.frequency.value = 320; bf.Q.value = .7;
    const bg = AC.createGain(); bg.gain.value = .06;
    const blfo = AC.createOscillator(); blfo.frequency.value = .11;
    const blg = AC.createGain(); blg.gain.value = .05; blfo.connect(blg); blg.connect(bg.gain); blfo.start();
    br.connect(bf); bf.connect(bg); bg.connect(g); bg.connect(verbSend); br.start();
    lp.connect(g); g.connect(music); g.connect(verbSend);
    g.gain.linearRampToValueAtTime(.42, t + 3);
    drone = { g, lp, nodes: [lfo, blfo, br, ...oscs], hb: 0, hit: 0 };
    heartbeat(); hits();
  }
  function thump(t, vol) {
    const o = AC.createOscillator(); o.type = 'sine'; o.frequency.setValueAtTime(62, t); o.frequency.exponentialRampToValueAtTime(34, t + .25);
    const g = AC.createGain(); g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + .02); g.gain.exponentialRampToValueAtTime(.001, t + .38);
    o.connect(g); g.connect(music); o.start(t); o.stop(t + .4);
  }
  function heartbeat() {
    if (!drone) return;
    const t = AC.currentTime + .05, per = 60 / (44 + intensity * 86);
    thump(t, .5 + intensity * .3); thump(t + per * .28, .28 + intensity * .2);
    heart.at = performance.now() + 50; heart.per = per * 1000;
    drone.hb = setTimeout(heartbeat, per * 1000);
  }
  function hits() {
    if (!drone) return;
    const t = AC.currentTime, n = AC.createBufferSource(); n.buffer = noiseBuf; n.loop = true;
    const f = AC.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = rnd(600, 2400); f.Q.value = 18;
    const g = AC.createGain(); g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(rnd(.08, .2), t + .01); g.gain.exponentialRampToValueAtTime(.0001, t + rnd(.6, 1.8));
    n.connect(f); f.connect(g); g.connect(verbSend); g.connect(music); n.start(t); n.stop(t + 2);
    drone.hit = setTimeout(hits, rnd(5000, 14000) * (1.2 - intensity * .8));
  }
  function setIntensity(v) {
    intensity = clamp(v, 0, 1);
    if (!drone) return;
    const t = AC.currentTime;
    const ramp = (p, to) => { p.cancelScheduledValues(t); p.setValueAtTime(p.value, t); p.linearRampToValueAtTime(to, t + 1.5); };
    ramp(drone.lp.frequency, 180 + intensity * 900); ramp(drone.g.gain, .42 + intensity * .26);
  }
  function setDanger(v) { danger = !!v; }      // the beat grows an alarm while a game is on its last life
  function stopDrone() {
    if (!drone) return;
    const d = drone; drone = null; clearTimeout(d.hb); clearTimeout(d.hit);
    d.g.gain.cancelScheduledValues(AC.currentTime); d.g.gain.linearRampToValueAtTime(0, AC.currentTime + 2);
    setTimeout(() => d.nodes.forEach(n => { try { n.stop(); } catch (e) {} }), 2200);
  }

  // ---- combat pulse: an 8th-note bass sequence under a kick, whose tempo follows `intensity`;
  //      hats double at high intensity and a two-tone alarm joins while `danger` is set.
  const SEQ = [0, 0, 3, 0, 5, 0, 3, 2, 0, 0, 3, 0, 7, 6, 3, 2];
  function startBeat() {
    if (!AC || beat) return;
    let i = 0, next = AC.currentTime + .1;
    beat = { timer: 0 };
    const tick = () => {
      if (!beat) return;
      const step = 60 / (116 + intensity * 64) / 2;
      while (next < AC.currentTime + .25) {
        const f = 55 * Math.pow(2, SEQ[i % SEQ.length] / 12);
        const o = AC.createOscillator(); o.type = 'square'; o.frequency.value = f;
        const o2 = AC.createOscillator(); o2.type = 'sawtooth'; o2.frequency.value = f * 2.003;
        const fl = AC.createBiquadFilter(); fl.type = 'lowpass'; fl.frequency.setValueAtTime(900, next); fl.frequency.exponentialRampToValueAtTime(140, next + step * .9);
        const g = AC.createGain(); g.gain.setValueAtTime(0, next); g.gain.linearRampToValueAtTime(i % 4 === 0 ? .2 : .12, next + .01); g.gain.exponentialRampToValueAtTime(.001, next + step * .95);
        o.connect(fl); o2.connect(fl); fl.connect(g); g.connect(music); o.start(next); o2.start(next); o.stop(next + step); o2.stop(next + step);
        if (i % 8 === 0) {   // kick
          const ko = AC.createOscillator(); ko.type = 'sine'; ko.frequency.setValueAtTime(130, next); ko.frequency.exponentialRampToValueAtTime(38, next + .12);
          const kg = AC.createGain(); kg.gain.setValueAtTime(.5, next); kg.gain.exponentialRampToValueAtTime(.001, next + .22);
          ko.connect(kg); kg.connect(music); ko.start(next); ko.stop(next + .25);
        }
        if (i % 8 === 4 || (intensity > .8 && i % 2 === 1)) {   // hats
          const n = AC.createBufferSource(); n.buffer = noiseBuf; const hf = AC.createBiquadFilter(); hf.type = 'highpass'; hf.frequency.value = 5000;
          const hg = AC.createGain(); hg.gain.setValueAtTime(i % 8 === 4 ? .07 : .03, next); hg.gain.exponentialRampToValueAtTime(.001, next + .05);
          n.connect(hf); hf.connect(hg); hg.connect(music); n.start(next); n.stop(next + .06);
        }
        if (danger && i % 8 === 6) {   // alarm
          const a = AC.createOscillator(); a.type = 'sawtooth'; a.frequency.setValueAtTime(1180, next); a.frequency.exponentialRampToValueAtTime(880, next + step * 1.6);
          const af = AC.createBiquadFilter(); af.type = 'bandpass'; af.frequency.value = 1000; af.Q.value = 3;
          const ag = AC.createGain(); ag.gain.setValueAtTime(.06, next); ag.gain.exponentialRampToValueAtTime(.001, next + step * 1.8);
          a.connect(af); af.connect(ag); ag.connect(music); ag.connect(verbSend); a.start(next); a.stop(next + step * 2);
        }
        next += step; i++;
      }
      beat.timer = setTimeout(tick, 80);
    };
    tick();
  }
  function stopBeat() { if (beat) { clearTimeout(beat.timer); beat = null; } }

  // ---- one-bit sfx
  function tone(type, f0, f1, dur, vol, bus, at) {
    const t = at ?? AC.currentTime, o = AC.createOscillator(); o.type = type; o.frequency.setValueAtTime(f0, t);
    if (f1 !== f0) o.frequency.exponentialRampToValueAtTime(Math.max(1, f1), t + dur);
    const g = AC.createGain(); g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.0005, t + dur);
    o.connect(g); g.connect(bus || sfxBus); o.start(t); o.stop(t + dur + .02);
  }
  function rumble(dur, vol, hz) {
    const t = AC.currentTime, n = AC.createBufferSource(); n.buffer = noiseBuf; n.loop = true;
    const f = AC.createBiquadFilter(); f.type = hz ? 'bandpass' : 'lowpass'; f.frequency.value = hz || 400; f.Q.value = hz ? 1.5 : 1;
    const g = AC.createGain(); g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.0005, t + dur);
    n.connect(f); f.connect(g); g.connect(sfxBus); g.connect(verbSend); n.start(t); n.stop(t + dur + .05);
  }
  const guard = fn => (...a) => { if (AC) try { fn(...a); } catch (e) {} };
  const sfx = {
    blip:   guard(() => tone('square', 880, 880, .06, .12)),
    bounce: guard(() => tone('square', 440, 440, .05, .1)),
    hit:    guard(() => tone('square', 220, 90, .12, .18)),
    smash:  guard(() => { tone('square', 1200, 300, .09, .14); tone('triangle', 600, 2400, .06, .08); }),
    shoot:  guard(() => tone('square', 1400, 500, .07, .06)),
    kill:   guard(() => { tone('square', 300, 60, .18, .16); rumble(.2, .18, 900); }),
    hurt:   guard(() => { tone('sawtooth', 160, 40, .35, .25); rumble(.3, .3); }),
    count:  guard(go => tone('square', go ? 880 : 440, go ? 880 : 440, go ? .3 : .08, .14)),
    win:    guard(() => [330, 440, 554, 880].forEach((f, i) => tone('square', f, f, .25, .13, sfxBus, AC.currentTime + i * .12))),
    lose:   guard(() => { tone('sawtooth', 220, 28, 1.2, .3); tone('square', 233, 30, 1.2, .18); }),
    thud:   guard(() => { tone('sine', 70, 28, .6, .9, music); rumble(.6, .25); }),
    glitch: guard(() => rumble(.45, .35, 1800)),
    ignite: guard(() => { tone('sawtooth', 30, 110, 2.5, .25, music); rumble(2.5, .2, 220); }),
    rune:   guard(i => { const f = [196, 247, 294, 392][i] || 196; tone('square', f, f, .18, .14); tone('square', f * 2.01, f * 2.01, .12, .04); }),
  };

  async function resume() { if (AC && AC.state === 'suspended') await AC.resume(); }
  return { init, resume, ctx: () => AC, analyser: () => analyser, voiceBus: () => voiceBus, send: () => verbSend, noise: () => noiseBuf,
           startDrone, stopDrone, setIntensity, setDanger, startBeat, stopBeat, sfx, heart };
})();

// ------------------------------ VOICE --------------------------------
// speechSynthesis pitched as low as it goes, over a synthesized demon layer:
// detuned sub-bass saws ring-modulated and driven into an asymmetric clipper,
// split into a chest lowpass and a throat bandpass whose formant jumps on every
// word, with a pitch wobble and a tremor, into the reverb. It is pulsed on every
// word boundary with a crackle of static, so the voice reads as something
// inhuman even where the engine ignores pitch (iOS). Subtitles are typed in
// sync with the words.
const Voice = (() => {
  let speaking = false, voices = [];
  const lineEl = $('line');
  const hasTTS = 'speechSynthesis' in window;
  function loadVoices() { if (hasTTS) voices = speechSynthesis.getVoices(); }
  if (hasTTS) { loadVoices(); speechSynthesis.onvoiceschanged = loadVoices; }
  function pickVoice() {
    const pref = ['Daniel', 'Microsoft David', 'Microsoft George', 'Microsoft Ryan', 'Microsoft Guy', 'Microsoft Mark', 'Google UK English Male', 'Arthur', 'Oliver', 'Fred', 'Rishi', 'Alex', 'Aaron', 'en-GB', 'en-US', 'en'];

          const cx = B.x + 12, cy = B.y + 12, aim = clamp((s.x + 4 - cx) / 1.4, -60, 60);
          for (const o of [-48, 0, 48]) s.eshots.push({ x: cx, y: cy, vx: aim + o, vy: (100 + rage * 35) * pace + s.lvl * 6 });
          if (Math.random() < .5) s.foes.push({ x: cx - 4, y: cy, vx: rnd(-1, 1) * 50, f: 0, dive: 0 });
          B.cd = Math.max(.42, 1.2 - rage * .7) / pace; Audio_.sfx.shoot();
        }
        for (const p of s.shots) if (p.y > -1 && p.y > B.y && p.y < B.y + 13 && p.x > B.x && p.x < B.x + 25) { p.y = -99; B.hp--; B.hurt = .07; burst(p.x, B.y + 13, 3); Audio_.sfx.hit(); }
        if (B.hp <= 0) { burst(B.x + 12, B.y + 6, 50, 110); shake(.6); flash(); return true; }
      }
      const hit = s.eshots.some(p => p.x > s.x - 1 && p.x < s.x + 9 && p.y > GH - 20 && p.y < GH - 12) || s.foes.some(f => f.y + 8 > GH - 20 && f.y < GH - 12 && f.x < s.x + 8 && f.x + 9 > s.x);
      if (hit && s.inv <= 0) { s.lives--; s.inv = 1.4; flash(); shake(.3); Audio_.sfx.hurt(); burst(s.x + 4, GH - 15, 12); s.eshots = []; if (!s.lives) { s.why = B ? 'THE WARDEN STANDS' : 'TAKEN BY THE SWARM'; return false; } }
      s.heat = B ? .7 + .3 * (1 - B.hp / B.max) : prog * .65; s.danger = s.lives === 1 || (!!B && B.hp <= 4);
    },
    draw: s => {
      if (s.inv <= 0 || Math.floor(s.t * 14) % 2) sprite(SHIP, s.x, GH - 20);
      s.shots.forEach(p => px(p.x, p.y, 1, 4)); s.eshots.forEach(p => px(p.x, p.y, 2, 3));
      s.foes.forEach(f => sprite(FOE[Math.floor(s.t * (f.dive ? 12 : 4) + f.f) % 2], f.x, f.y));
      const B = s.boss;
      if (B) {
        const inv = B.hurt > 0; if (inv) px(B.x - 1, B.y - 1, 27, 15); sprite(WARDEN, B.x, B.y, inv ? '#000' : '#fff');
        px(B.x + 11 + clamp((s.x - B.x - 8) / 20, -3, 3), B.y + 5, 3, 3, inv ? '#fff' : '#000');     // it looks at you
        px(28, 3, 104, 1, '#444'); px(28, 2, Math.round(104 * B.hp / B.max), 3);
      }
      for (let i = 0; i < s.lives; i++) px(4 + i * 6, 4, 4, 4);
      if (!B) text(`${s.kills}/${s.need}`, 5, '#888');
      if (s.comboT > 0 && s.combo >= 2) text(`X${s.combo}`, 14, '#fff', 2);
    }
  };

  // ---- 3. OUTRUN THE STATIC: falling static and barred gates, then seekers that hunt
  //      your position (and commit to a column before they reach you), then lashes that
  //      whip in from the edges and cover half the screen; the last four seconds run
  //      negative and a quarter faster. Fifteen seconds, a little more per tier. One
  //      life, so nothing is allowed to coincide with a gate in a way that leaves no
  //      room: static never spawns into a gate's gap it would arrive with, and a lash
  //      comes from the side that leaves the gap open.
  const DODGE = {
    name: 'OUTRUN THE STATIC', brief: lvl => `SURVIVE ${15 + Math.min(4, Math.ceil(lvl / 2))} SECONDS. ONE LIFE.`, help: ['DRAG TO MOVE', '← → OR A D TO MOVE'],
    init: lvl => ({ x: 76, rocks: [], bars: [], seekers: [], lashes: [], t: 0, goal: 15 + Math.min(4, Math.ceil(lvl / 2)), spawn: .3, bar: 2.2, seek: 1, lash: 1, near: 0, phase: 0, heat: 0, danger: false, inverted: false }),
    step: (s, dt) => {
      const od = s.t > s.goal - 4, m = (od ? 1.25 : 1) * (1 + s.lvl * .03);
      s.t += dt; s.spawn -= dt * m; s.bar -= dt * m; s.seek -= dt; s.lash -= dt; s.x = paddleInput(s.x, 8, 215, dt);
      if (s.phase < 1 && s.t > 4) { s.phase = 1; note(s, 'SEEKERS'); Audio_.sfx.thud(); }
      if (s.phase < 2 && s.t > 8) { s.phase = 2; note(s, 'LASHES'); Audio_.sfx.thud(); }
      if (s.phase < 3 && od) { s.phase = 3; s.inverted = true; note(s, 'OVERDRIVE'); Audio_.sfx.glitch(); shake(.4); buzz([30, 30, 30]); }
      const py = GH - 16, arrives = o => (py - o.y) / o.v;                 // seconds until something reaches you
      if (s.spawn <= 0) {
        const r = { x: rnd(0, GW - 6), y: -6, v: (70 + s.t * 8) * m, w: rnd(4, 10) | 0 };
        for (let i = 0; i < 4 && s.bars.some(b => Math.abs(arrives(b) - arrives(r)) < .45 && r.x + r.w > b.gap - 2 && r.x < b.gap + b.gw + 2); i++) r.x = rnd(0, GW - 6);
        s.rocks.push(r); s.spawn = Math.max(.1, .36 - s.t * .017);
      }
      if (s.bar <= 0) { const gw = Math.max(22, 30 + Math.max(0, 6 - s.t * .6) - s.lvl), gap = rnd(6, GW - gw - 6); s.bars.push({ y: -4, gap, gw, v: (50 + s.t * 3.5) * m }); s.bar = Math.max(1.2, rnd(2, 3.2) - s.t * .07); }
      if (s.phase >= 1 && s.seek <= 0) { s.seekers.push({ x: rnd(4, GW - 12), y: -8, vy: (56 + s.t * 3) * m }); s.seek = Math.max(1.1, 2.4 - s.t * .08); }
      if (s.phase >= 2 && s.lash <= 0) {
        const warn = Math.max(.45, .8 - s.t * .02), coming = s.bars.filter(b => arrives(b) > warn - .1).sort((a, b) => arrives(a) - arrives(b));   // the gates still to pass once the lash is out
        const bar = coming.find(b => arrives(b) < warn + 1.1) || coming[0];
        const side = bar ? (bar.gap + bar.gw / 2 < GW / 2 ? -1 : 1) : Math.random() < .5 ? 1 : -1;     // from the side that leaves the next gate's gap open
        s.lashes.push({ side, t: 0, warn, len: 0 }); s.lash = Math.max(1.9, 3.2 - s.t * .08);
      }
      s.rocks.forEach(r => r.y += r.v * dt); s.rocks = s.rocks.filter(r => r.y < GH);
      s.bars.forEach(b => b.y += b.v * dt); s.bars = s.bars.filter(b => b.y < GH);
      for (const e of s.seekers) {
        if (e.y < 150) e.x += clamp((s.x - e.x) * 2.5, -(58 + s.t * 2), 58 + s.t * 2) * dt;
        else if (!e.set) {                                                // it commits to a column, veering clear of a gate's gap it would arrive with
          e.set = 1;
          for (const b of s.bars) if (Math.abs(arrives(b) - (py - e.y) / e.vy) < .5 && e.x + 8 > b.gap - 2 && e.x < b.gap + b.gw + 2) e.x = clamp(e.x + 4 < b.gap + b.gw / 2 ? b.gap - 10 : b.gap + b.gw + 2, 0, GW - 8);
        }
        e.y += e.vy * dt;
      }
      s.seekers = s.seekers.filter(e => e.y < GH);
      for (const L of s.lashes) { L.t += dt; const e = L.t - L.warn, R = GW / 2; L.len = e < 0 ? 0 : e < .3 ? e / .3 * R : e < .65 ? R : Math.max(0, 1 - (e - .65) / .35) * R; }
      s.lashes = s.lashes.filter(L => L.t < L.warn + 1.05);
      for (const r of s.rocks) { const hitX = r.x < s.x + 8 && r.x + r.w > s.x, hitY = r.y + 6 > py && r.y < py + 8; if (hitX && hitY) { s.why = 'STRUCK BY STATIC'; return false; } if (!r.n && hitY && r.x < s.x + 14 && r.x + r.w > s.x - 6) { r.n = 1; Audio_.sfx.blip(); s.near++; } }
      for (const b of s.bars) if (b.y + 3 > py && b.y < py + 8 && (s.x < b.gap || s.x + 8 > b.gap + b.gw)) { s.why = 'THE BAR TOOK YOU'; return false; }
      for (const e of s.seekers) if (e.x < s.x + 8 && e.x + 8 > s.x && e.y + 8 > py && e.y < py + 8) { s.why = 'A SEEKER FOUND YOU'; return false; }
      for (const L of s.lashes) if (L.len > 0 && (L.side > 0 ? s.x < L.len : s.x + 8 > GW - L.len)) { s.why = 'LASHED'; return false; }
      s.heat = s.t / s.goal; s.danger = od;
      if (s.t >= s.goal) return true;
    },
    draw: s => {
      px(s.x, GH - 16, 8, 8); px(s.x + 2, GH - 14, 4, 4, '#000'); px(s.x + 3, GH - 13, 2, 2);
      s.rocks.forEach(r => { px(r.x, r.y, r.w, 6); if (r.w > 5) px(r.x + 1, r.y + 1, r.w - 2, 4, '#000'); });
      s.bars.forEach(b => { px(0, b.y, b.gap, 3); px(b.gap + b.gw, b.y, GW - b.gap - b.gw, 3); });
      s.seekers.forEach(e => { px(e.x, e.y, 8, 8); px(e.x + 1, e.y + 1, 6, 6, '#000'); if (e.y >= 150 || Math.floor(s.t * 8) % 2) px(e.x + 3, e.y + 3, 2, 2); });
      for (const L of s.lashes) { if (L.len > 0) px(L.side > 0 ? 0 : GW - L.len, GH - 14, L.len, 4); else if (Math.floor(L.t * 14) % 2) px(L.side > 0 ? 0 : GW - 3, GH - 26, 3, 26); }
      text(`${Math.ceil(s.goal - s.t)}`, 5, '#888'); px(0, GH - 1, GW * (s.t / s.goal), 1);
    }
  };

  // ---- 4. RECITE THE SIGIL: nothing to dodge and nowhere to run. The eye flashes a
  //      sequence of four runes, two to begin with (more at higher tiers), one longer
  //      and faster every round; recite it back, in order, before the timer drains.
  //      Five rounds. One wrong rune ends it.
  const RUNES = [
    ['...#...', '..###..', '.#.#.#.', '#..#..#', '...#...', '...#...', '...#...'],   // up: the trident
    ['#.....#', '.#...#.', '..#.#..', '...#...', '..#.#..', '.#...#.', '#.....#'],   // right: the cross
    ['..###..', '.#...#.', '#..#..#', '#.###.#', '#..#..#', '.#...#.', '..###..'],   // down: the eye
    ['#######', '#.....#', '#.###.#', '#.#.#.#', '#.###.#', '#.....#', '#######'],   // left: the cell
  ];
  const RUNE_AT = [{ x: 80, y: 86 }, { x: 116, y: 122 }, { x: 80, y: 158 }, { x: 44, y: 122 }];   // centres: up, right, down, left
  const CENTRE = { x: 80, y: 122 };
  const SIGIL = {
    name: 'RECITE THE SIGIL', brief: 'REPEAT THE SEQUENCE. 5 ROUNDS.', help: ['WATCH · THEN TAP THE RUNES IN ORDER', 'WATCH · THEN ↑ → ↓ ← OR W D S A IN ORDER'],
    init: lvl => ({ seq: Array.from({ length: 1 + Math.min(2, Math.floor(lvl / 3)) }, () => Math.floor(Math.random() * 4)), round: 0, rounds: 5, phase: 'wait', t: .6, age: 0, i: 0, lit: -1, on: 0, show: .3, gap: .1, limit: 1.6, timer: 0, heat: 0, danger: false, look: CENTRE }),
    step: (s, dt) => {
      s.t -= dt; s.on -= dt; s.age += dt;
      if (s.on <= 0 && s.phase !== 'show') s.lit = -1;
      s.look = s.lit >= 0 ? RUNE_AT[s.lit] : CENTRE;
      const taps = takeTaps();
      if (s.phase === 'wait') {                                       // between rounds: one more rune, then the eye recites
        if (s.t <= 0) {
          s.seq.push(Math.floor(Math.random() * 4)); s.round++; s.i = 0; s.phase = 'show'; s.t = .35;
          s.show = Math.max(.15, .3 - s.round * .025 - s.lvl * .012); s.gap = Math.max(.05, .1 - s.round * .008); s.limit = Math.max(.7, 1.6 - s.round * .12 - s.lvl * .06);
          note(s, `ROUND ${s.round}`, .6);
        }
      } else if (s.phase === 'show') {
        if (s.t <= 0) {
          if (s.lit >= 0) { s.lit = -1; s.t = s.gap; s.i++; }
          else if (s.i < s.seq.length) { s.lit = s.seq[s.i]; s.t = s.show; Audio_.sfx.rune(s.lit); }
          else { s.phase = 'input'; s.i = 0; s.timer = s.limit; }
        }
      } else if (s.phase === 'input') {                               // you recite
        s.timer -= dt;
        if (s.timer <= 0) { s.why = 'TOO SLOW'; return false; }
        for (const d of taps) {
          s.lit = d; s.on = .16;
          if (d !== s.seq[s.i]) { s.on = 9; s.why = 'WRONG RUNE'; return false; }
          s.i++; s.timer = s.limit; Audio_.sfx.rune(d); burst(RUNE_AT[d].x, RUNE_AT[d].y, 6, 40);
          if (s.i >= s.seq.length) {
            if (s.round >= s.rounds) { flash(); return true; }
            s.phase = 'wait'; s.t = .6; flash(); shake(.15); Audio_.sfx.smash(); buzz(15); break;
          }
        }
      }
      s.heat = (s.round - 1) / s.rounds + (s.phase === 'input' ? .1 : 0);
      s.danger = s.round >= s.rounds - 1 || (s.phase === 'input' && s.timer < s.limit * .35);
    },
    draw: s => {
      const L = s.lit >= 0 ? RUNE_AT[s.lit] : null;
      sprite(['....#####....', '..##.....##..', '.#.........#.', '#...........#', '.#.........#.', '..##.....##..', '....#####....'], CENTRE.x - 6, CENTRE.y - 3);
      px(CENTRE.x - 1 + (L ? Math.sign(L.x - CENTRE.x) * 3 : 0), CENTRE.y - 1 + (L ? Math.sign(L.y - CENTRE.y) : 0), 3, 3);     // the pupil follows the lit rune
      RUNES.forEach((r, i) => {
        const c = RUNE_AT[i], lit = s.lit === i;
        if (lit) px(c.x - 8, c.y - 8, 17, 17); else { px(c.x - 8, c.y - 8, 17, 1); px(c.x - 8, c.y + 8, 17, 1); px(c.x - 8, c.y - 8, 1, 17); px(c.x + 8, c.y - 8, 1, 17); }
        sprite(r, c.x - 3, c.y - 3, lit ? '#000' : '#fff');
      });
      for (let i = 0; i < s.seq.length; i++) px(CENTRE.x - s.seq.length * 2 + i * 4, 176, 3, 3, i < s.i ? '#fff' : '#444');
      if (s.phase === 'input') { px(0, GH - 2, Math.round(GW * s.timer / s.limit), 2); text('RECITE', 14, Math.floor(s.age * 6) % 2 ? '#fff' : '#888'); }
      else if (s.phase === 'show') text('WATCH', 14, '#888');
      text(`ROUND ${Math.max(1, s.round)}/${s.rounds}`, 5, '#888');
    }
  };

  // ---- skill: every game remembers how often it has been beaten, across visits. A win
  //      raises that game's tier for its next trial by one; two losses in a row lower it
  //      by one, so a trial stays winnable. Each tier is a nudge, never a wall.
  const GAMES = [BRICKS, SHMUP, DODGE, SIGIL], TIERS = 9, SKILL_KEY = 'gatekeeper.skill';
  let skill = {}, lastGame = null;
  try { skill = JSON.parse(localStorage.getItem(SKILL_KEY) || '{}') || {}; } catch (e) { skill = {}; }
  const save = () => { try { localStorage.setItem(SKILL_KEY, JSON.stringify(skill)); } catch (e) {} };
  const tier = def => clamp((skill[def.name] || {}).tier | 0, 0, TIERS);
  function record(def, won) {
    const k = skill[def.name] || (skill[def.name] = { tier: 0, lost: 0, played: 0, won: 0 });
    k.played++;
    if (won) { k.won++; k.lost = 0; k.tier = Math.min(TIERS, k.tier + 1); }
    else if (++k.lost >= 2) { k.lost = 0; k.tier = Math.max(0, k.tier - 1); }
    save(); return k.tier;
  }
  function random() { let gm; do gm = pick(GAMES); while (gm === lastGame && GAMES.length > 1); lastGame = gm; return gm; }
  async function trial() { const def = random(), won = await run(def, tier(def)); record(def, won); return won; }
  return {
    GAMES, run, random, tier, record, trial,
    byName: n => GAMES.find(x => x.name.toLowerCase().includes(n.toLowerCase())),
    skill: () => JSON.parse(JSON.stringify(skill)),      // what each game remembers: { tier, won, lost (in a row), played }
    forget() { skill = {}; save(); },                     // every game starts from the first tier again
    end: r => resolveNow && resolveNow(r),                // debug / test hook: finish the running game
    current: () => current,                               // debug / test hook: the running game's state
  };
})();

// ----------------------------- BACKEND -------------------------------
// The one touchpoint. With CONFIG.api set (?api=..., or a bridge detected on
// the page's own origin) it POSTs { question, session } to <api>/ask and reads
// the server-sent stream: delta (text), tool/status (what the oracle is doing),
// done, error. Without it, a mock oracle answers in character, streamed the
// same way, so the rest of the page never knows the difference.
async function detectBridge() {
  if (CONFIG.api === null && location.protocol === 'file:') return;
  const base = CONFIG.api === null ? '' : CONFIG.api.replace(/\/$/, '');
  try {
    const r = await fetch(base + '/health', { signal: typeof AbortSignal.timeout === 'function' ? AbortSignal.timeout(2500) : undefined });
    const j = await r.json();
    if (j && j.gatekeeper) { CONFIG.api = base; CONFIG.oracle = String(j.oracle || 'live').replace(/-/g, ' ').toUpperCase(); CONFIG.model = j.model || null; }
  } catch (e) { if (CONFIG.api !== null) CONFIG.oracle = 'LIVE'; }
}
async function askClaude(question, { onDelta = () => {}, onEvent = () => {}, signal } = {}) {
  if (CONFIG.api !== null) {
    const r = await fetch(CONFIG.api.replace(/\/$/, '') + '/ask', {
      method: 'POST', signal,
      headers: { 'Content-Type': 'application/json', Accept: 'text/event-stream', ...(CONFIG.key ? { 'x-gatekeeper-key': CONFIG.key } : {}) },
      body: JSON.stringify({ question, session: CONFIG.session }),
    });
    if (!r.ok) { let m = `the gate returned ${r.status}`; try { m = (await r.json()).error || m; } catch (e) {} throw new Error(m); }
    if (!/text\/event-stream/.test(r.headers.get('content-type') || '')) return String((await r.json()).answer);
    const reader = r.body.getReader(), dec = new TextDecoder();
    let buf = '', text = '', done = null;
    while (true) {
      const { value, done: end } = await reader.read(); if (end) break;
      buf += dec.decode(value, { stream: true });
      let i;
      while ((i = buf.indexOf('\n\n')) >= 0) {
        const chunk = buf.slice(0, i); buf = buf.slice(i + 2);
        const dataLine = chunk.split('\n').find(l => l.startsWith('data:')); if (!dataLine) continue;
        let ev; try { ev = JSON.parse(dataLine.slice(5)); } catch (e) { continue; }
        if (ev.type === 'delta') { text += ev.text; onDelta(ev.text); }
        else if (ev.type === 'tool' || ev.type === 'status') onEvent(ev.label || ev.text || '');
        else if (ev.type === 'done') done = String(ev.answer ?? text);
        else if (ev.type === 'error') throw new Error(ev.message || 'the session failed');
      }
    }
    if (done === null && !text) throw new Error('the session went silent');
    return done ?? text;
  }
  // ---- mock oracle (no server): in character, keyword-aware, streamed word by word
  await wait(rnd(500, 900)); onEvent('SCANNING /');
  await wait(rnd(500, 900)); onEvent('READING SRC/MAIN.TS');
  await wait(rnd(400, 800));
  const q = question.toLowerCase();
  const rules = [
    [/test|spec|coverage/, 'There are 214 tests. Three are skipped, and I would not trust the skipped ones. The slowest suite is the integration run against the fixtures in test/fixtures; it alone takes forty seconds.'],
    [/auth|login|token|session|password/, 'Authentication lives in src/auth. It issues short-lived access tokens and refreshes them silently from an httpOnly cookie. Nothing else should ever read that cookie. One module tries. Look at it.'],
    [/build|deploy|ci|pipeline|release/, 'The build runs through Vite. Dev server on port 5173, production bundle in dist. Deploys go out from the release workflow on tags only. Pushing to main deploys nothing. That is deliberate.'],
    [/db|database|migrat|prisma|sql|schema/, 'The database layer uses Prisma. Migrations are in prisma/migrations and are generated, never written by hand. The schema has a soft-delete flag that two queries forget to honour.'],
    [/bug|error|crash|fail|broken|why/, 'The failure begins at the boundary: the event bus in packages/core delivers out of order under load, and the consumer assumes order. Fix the consumer. The bus will not change for you.'],
    [/who|what are you|your name|yourself/, 'I am what watches the session when you are not looking. I keep the context. I keep the keys. You keep winning my games, and we will keep speaking.'],
    [/api|endpoint|route|rest|graphql/, 'The public API is defined once, in packages/api/schema. The route handlers are generated from it. If a route exists that the schema does not describe, it is a ghost. Remove it.'],
    [/perf|slow|fast|latency|memory/, 'The slow path is the serializer. It walks the object graph twice. Cache the first walk and you reclaim most of what you are losing. The rest is the network, and the network is not mine.'],
  ];
  const found = rules.find(([re]) => re.test(q));
  const text = found ? found[1] : pick([
    'That service is deprecated. The replacement is the event bus in packages/core. Everything still calling the old one is listed in the deprecation report. Nobody has read it.',
    'The entry point is src/main.ts. It wires the router, the store and the telemetry, in that order, and the order matters more than the comments admit.',
    'The configuration is layered: defaults, then the environment file, then flags. Flags win. Someone shipped a flag that is always on. It is the third one.',
    'The module you are asking about is six hundred lines, and a third of them are dead. I can tell you which third. Ask again, and ask better.',
    'Two code paths do the same work. One of them is correct. The tests cover the other.',
  ]);
  let out = '';
  for (const w of text.split(/(?<=\s)/)) { if (signal && signal.aborted) break; out += w; onDelta(w); await wait(rnd(25, 60)); }
  return out;
}

// ------------------------------- GATE --------------------------------
const Gate = (() => {
  const TAUNTS = [
    'You want answers. First, you must defeat me.',
    'Nothing is given here. Earn it.',
    'Knowledge has a price. Pay it in reflexes.',
    'The gate does not open for the unworthy. Prove yourself.',
    'You knock. I decide. Survive this first.',
    'Every question is a wager. Let us see what you have.',
    'I have watched a thousand like you fail. Begin.',
    'The session is mine. You may borrow a glimpse, if you live.',
    'Interesting question. Irrelevant, until you win.',
    'Your hands. My rules. Show me.',
  ];
  const LOSE = ['Pathetic. The gate remains closed.', 'You were not ready. Return when you are.', 'Failure. As expected.', 'The code keeps its secrets tonight.', 'That was the easy one.'];
  const LOSE_AGAIN = ['Again? You learn nothing.', 'Each failure is noted. Each one.', 'Perhaps the question was never meant for you.', 'I could watch this all night. Could you?'];
  const WIN = ['Acceptable. I will answer. This once.', 'Impressive. Very well. Speak, and I shall tell you.', 'You have earned a fragment. Listen.', 'The gate opens. Do not get used to it.'];
  const WIN_STREAK = ['Again. You are becoming a problem.', 'Fine. Take it. I am not finished with you.', 'You win too often. I will remember that.'];
  const CONSULT = ['Consulting the session.', 'Reading what you could not.', 'The context is open to me. One moment.'];
  const IDLE = ['I am still here.', 'Ask. Or leave.', 'The session waits. So do I.', 'I can hear you thinking. It is not impressive.', 'Silence is also an answer. A cowardly one.'];
  const ui = $('ui'), q = $('q'), askBtn = $('ask'), mic = $('mic'), answer = $('answer'), abody = $('abody'), line = $('line');
  let busy = false, fails = 0, wins = 0, lastActivity = performance.now(), attendTimer = 0, currentAsk = null;
  addEventListener('pagehide', () => currentAsk && currentAsk.abort());

  function glitch() { const el = $('glitch'); el.classList.remove('on'); void el.offsetWidth; el.classList.add('on'); Audio_.sfx.glitch(); buzz(40); }
  function setBusy(v) { busy = v; askBtn.disabled = v; mic.disabled = v; q.disabled = v; }
  function hideAnswer() { answer.classList.remove('on'); }
  function showAnswer() {
    renderReadout('', false);
    $('astamp').textContent = `${CONFIG.oracle || (CONFIG.api !== null ? 'LIVE' : 'MOCK')} · SESSION ${CONFIG.session.toUpperCase()}`;
    answer.classList.add('on');
  }
  function renderReadout(text, final) {
    abody.textContent = text;
    if (!final) { const c = document.createElement('span'); c.className = 'cur'; abody.appendChild(c); }
    answer.scrollTop = answer.scrollHeight;
  }
  // Speaks the readout sentence by sentence as the text streams in, so the
  // voice starts before the oracle has finished.
  function makeSpeaker() {
    let upTo = 0, queue = [], running = null, started = false;
    const re = /[.!?…]["')\]]*(?:\s+)|\n\s*\n/g;
    const drain = async () => { while (queue.length) await Voice.say(queue.shift(), { silent: true, hold: 80 }); running = null; };
    const kick = () => { if (started && !running && queue.length) running = drain(); };
    return {
      start() { started = true; kick(); },
      push(text) { re.lastIndex = upTo; let m; while ((m = re.exec(text))) { const s = text.slice(upTo, m.index + m[0].length).trim(); upTo = m.index + m[0].length; if (s) queue.push(s); } kick(); },
      async finish(text) { const rest = text.slice(upTo).trim(); upTo = text.length; if (rest) queue.push(rest); started = true; kick(); while (running) await running; },
    };
  }
  function pulseLine(text) { let n = 0; line.textContent = text; const id = setInterval(() => { line.textContent = text + '.'.repeat(n = (n + 1) % 4); }, 400); return () => clearInterval(id); }

  async function gate(question) {
    question = (question || '').trim();
    if (busy || !question) return;
    setBusy(true); hideAnswer(); q.value = ''; q.blur(); lastActivity = performance.now();
    Eye.setMood('attend'); Eye.look({ x: 0, y: .8 });
    await wait(450);
    Eye.look(null); Eye.setMood('angry'); Audio_.setIntensity(.55); Audio_.sfx.thud(); buzz(30);
    await Voice.say(pick(TAUNTS));
    glitch(); Audio_.setIntensity(.7);
    await wait(350);
    Eye.setMood('judge'); ui.classList.add('hidden'); Audio_.startBeat();
    const won = await Arena.trial();      // a game it has not just played, at the tier your record on that game has earned
    Audio_.stopBeat(); ui.classList.remove('hidden'); lastActivity = performance.now();
    if (!won) {
      fails++; Eye.setMood('contempt'); Audio_.setIntensity(.4); Audio_.sfx.lose(); glitch();
      await Voice.say(fails > 1 ? pick(LOSE_AGAIN) : pick(LOSE));
      Eye.setMood('idle'); Audio_.setIntensity(.1); setBusy(false); return;
    }
    wins++; fails = 0; Eye.setMood('pleased'); Audio_.setIntensity(.25);
    await Voice.say(wins > 1 ? pick(WIN_STREAK) : pick(WIN));
    Eye.setMood('consult'); glitch();
    const ac = new AbortController(); currentAsk = ac;
    const speaker = makeSpeaker();
    let text = '', answer, consulting = true, stopPulse = () => {};
    const opened = () => { stopPulse(); stopPulse = () => {}; line.textContent = 'THE GATE IS OPEN'; Eye.setMood('attend'); Audio_.setIntensity(.1); };
    showAnswer();
    const pending = askClaude(question, {
      onDelta: d => { if (!text && !consulting) opened(); text += d; renderReadout(text, false); speaker.push(text); },
      onEvent: label => { Audio_.sfx.blip(); if (consulting) return; stopPulse(); stopPulse = () => {}; line.textContent = String(label).toUpperCase().slice(0, 64); },
      signal: ac.signal,
    });
    const consult = Voice.say(pick(CONSULT), { hold: 0 }).then(() => { consulting = false; if (text) opened(); else stopPulse = pulseLine('CONSULTING'); speaker.start(); });
    try { answer = String(await pending); } catch (e) { answer = `The session did not answer. ${e && e.message ? e.message : e}`; }
    await consult; currentAsk = null;
    if (answer !== text) { text = answer; renderReadout(text, false); speaker.push(text); }   // non-streamed answer, or a final answer that differs
    opened();
    await speaker.finish(text);
    renderReadout(text, true);
    Eye.setMood('idle'); setBusy(false);
  }

  // the eye pays attention while you type, and mutters when ignored
  q.addEventListener('focus', () => { if (!busy) Eye.setMood('attend'); });
  q.addEventListener('blur', () => { if (!busy && Eye.mood() === 'attend') Eye.setMood('idle'); });
  q.addEventListener('input', () => { lastActivity = performance.now(); if (busy) return; Eye.setMood('attend'); clearTimeout(attendTimer); attendTimer = setTimeout(() => { if (!busy && document.activeElement !== q) Eye.setMood('idle'); }, 2500); });
  addEventListener('pointerdown', () => { lastActivity = performance.now(); });
  setInterval(async () => {
    if (busy || document.hidden || Eye.mood() === 'sleep' || performance.now() - lastActivity < rnd(55000, 110000)) return;
    lastActivity = performance.now(); Eye.setMood('attend'); await Voice.say(pick(IDLE)); if (!busy) Eye.setMood('idle');
  }, 15000);

  return { gate, hideAnswer, busy: () => busy, stats: () => ({ fails, wins }) };
})();

// ------------------------------- INPUT -------------------------------
{
  const q = $('q'), mic = $('mic');
  $('ask').onclick = () => Gate.gate(q.value);
  q.addEventListener('keydown', e => { if (e.key === 'Enter') Gate.gate(q.value); });
  addEventListener('keydown', e => {
    if (e.key === 'Escape') Gate.hideAnswer();
    if (e.key === '/' && document.activeElement !== q && !Gate.busy()) { e.preventDefault(); q.focus(); }
  });
  $('answer').addEventListener('click', Gate.hideAnswer);
  if (!Voice.canListen) mic.style.display = 'none';
  else mic.onclick = async () => {
    if (Gate.busy() || mic.classList.contains('live')) return;
    mic.classList.add('live'); Eye.setMood('attend'); Audio_.sfx.blip();
    await Voice.say('Speak.', { hold: 0 });
    const heard = await Voice.listen(t => { q.value = t; });
    mic.classList.remove('live');
    if (heard) { q.value = heard; Gate.gate(heard); }
    else { await Voice.say('I heard nothing.'); if (!Gate.busy()) Eye.setMood('idle'); }
  };
}

// -------------------------------- WAKE -------------------------------
$('wake').addEventListener('click', async function () {
  if (this.classList.contains('off')) return;
  this.classList.add('off');
  detectBridge();
  Audio_.init(); await Audio_.resume();
  if ('speechSynthesis' in window) speechSynthesis.getVoices();
  Eye.start(); Eye.setMood('waking');
  Audio_.sfx.ignite(); Audio_.startDrone(); Audio_.setIntensity(.3); buzz([20, 80, 60]);
  setTimeout(() => this.remove(), 1400);
  await wait(2300);
  Eye.setMood('idle'); Audio_.setIntensity(.1);
  await Voice.say(pick(['I am awake. Ask, if you dare.', 'You woke me. Make it worth it.', 'The session is sealed. Ask anyway.']));
}, { once: false });
document.addEventListener('visibilitychange', () => { if (!document.hidden) Audio_.resume(); });

// Console / test handle: GK.gate('question'), GK.arena.end(true) to force a win, GK.arena.run(GK.arena.byName('sigil'), 2),
// GK.arena.current() for the running game's state, GK.arena.skill() for each game's tier, GK.arena.forget(), GK.eye.setMood('angry'), …
window.GK = { gate: Gate.gate, say: Voice.say, eye: Eye, arena: Arena, audio: Audio_, stats: Gate.stats, askClaude };
</script>
